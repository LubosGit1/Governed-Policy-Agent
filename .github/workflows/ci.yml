name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: policy_assistant
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy -d policy_assistant"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://policy:policy@localhost:5432/policy_assistant
      LLM_PROVIDER: mock
      ADMIN_API_KEY: ci-test-admin-key
      RATE_LIMIT_HASH_SECRET: ci-only-rate-limit-hash
      RATE_LIMIT_MAX_REQUESTS: 200
      RATE_LIMIT_WINDOW_MS: 60000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-assistant-evaluation
          path: eval/reports/
          if-no-files-found: ignore
