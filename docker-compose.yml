services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: policy_assistant
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build:
      context: .
      target: builder
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: postgresql://policy:policy@db:5432/policy_assistant
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://policy:policy@db:5432/policy_assistant
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-30}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-local-dev-only-rate-limit-key}
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
